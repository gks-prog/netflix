<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love You Love</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 1. Preloader sits at the absolute top layer -->
    <div id="preloader">
        <svg viewBox="0 0 100 100" class="heart-loader">
            <path d="M 50,30 C 50,30 40,10 25,10 C 10,10 5,25 5,40 C 5,60 50,90 50,90 C 50,90 95,60 95,40 C 95,25 90,10 75,10 C 60,10 50,30 50,30 Z" />
        </svg>
    </div>
    
    <!-- 2. Navbar -->
    <header class="navbar">
        <h1 class="logo">Betti</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">is you</a>
            <a href="#">Sweetheart</a>
        </nav>
    </header>

    <!-- 3. Main Content Wrapper -->
    <main>
        <section class="hero" id="hero-section">
            <div class="hero-content">
                <h2 id="hero-title">Loading...</h2>
                <p id="hero-desc"></p>
                <button class="play-btn">▶ Play</button>
            </div>
        </section>

        <section class="catalog" id="catalog-section">
            <h3>Trending Now</h3>
            <div class="carousel" id="trending-carousel">
                <!-- Video thumbnails injected via JS -->
            </div>
        </section>
    </main>

    <!-- 4. Scripts MUST be at the bottom -->
    <!-- Load GSAP First -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Load Your App Logic Second -->
    <script src="app.js"></script>
</body>
</html>
